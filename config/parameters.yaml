# Market and tax parameters.
# Verify before each investment analysis. Sources in comments.
# Agent: if last_verified is older than 60 days — warn the user.

last_verified: 2026-08-22

# --- Retirement accounts ------------------------------------------------------
# Source: MRPiPS announcements, Monitor Polski; gov.pl/web/rodzina
# The annual limit does NOT roll over to the next year. Contribution deadline: December 31.
konta_emerytalne:
  rok: 2026
  ike:
    limit: 28260.00          # 3 × projected salary of 9,420 PLN
    limit_poprzedni_rok: 26019.00
    korzysc: "no Belka tax on withdrawal after age 60"
    ulga_pit: false
  ikze:
    limit_etat: 11304.00     # 1.2 × 9,420 PLN
    limit_jdg: 16956.00      # 1.8 × 9,420 PLN
    limit_etat_poprzedni_rok: 10407.60
    korzysc: "PIT base deduction in the contribution year; 10% flat tax on withdrawal after age 65"
    ulga_pit: true
  # Total for an employee using both: 39,564 PLN

# --- Taxes --------------------------------------------------------------------
podatki:
  belka: 0.19
  pit_prog_1: 0.12
  pit_prog_2: 0.32
  pit_prog_2_od: 120000.00

# --- Retail bonds -------------------------------------------------------------
# Source: obligacjeskarbowe.pl — AUGUST 2026 issuance.
# NOTE: interest rates change every month. Verify before purchasing.
# NOTE: interest is subject to 19% Belka tax OUTSIDE IKE/IKZE.
obligacje:
  emisja: 2026-08
  ots:                        # 3-month, fixed
    oprocentowanie: 0.0200
  ror:                        # 1-year, NBP rate + margin, monthly interest
    pierwszy_okres: 0.0400
    marza: 0.0000
    indeksacja: stopa_nbp
  dor:                        # 2-year
    pierwszy_okres: 0.0415
    marza: 0.0015
    indeksacja: stopa_nbp
  tos:                        # 3-year, fixed, capitalization
    oprocentowanie: 0.0440
  coi:                        # 4-year, inflation + margin, annual interest
    pierwszy_okres: 0.0475
    marza: 0.0150
    indeksacja: cpi
    okres_lat: 4
  edo:                        # 10-year, inflation + margin, capitalization
    pierwszy_okres: 0.0535
    marza: 0.0200
    indeksacja: cpi
    okres_lat: 10
  # Guarantee: under deflation, the rate does not fall below the margin.

# --- Macro environment --------------------------------------------------------
makro:
  stopa_referencyjna_nbp: 0.0375     # since 2026-03-05
  cpi_rr: 0.030                      # July 2026, GUS flash estimate
  cpi_rr_poprzedni: 0.025            # June 2026, final
  konto_oszczednosciowe_pko: 0.0100  # user's rate, all tiers
  konto_oszczednosciowe_rynek_top: 0.0600  # best market offers, usually promotional

# --- Simulation assumptions ----------------------------------------------------
# ALWAYS provide at least two scenarios. These are not forecasts.
symulacje:
  scenariusz_ostrozny:
    cpi: 0.025
    akcje_globalne_nominalnie: 0.050
    obligacje_edo: 0.045
  scenariusz_bazowy:
    cpi: 0.030
    akcje_globalne_nominalnie: 0.070
    obligacje_edo: 0.050
  horyzonty_lat: [1, 3, 5, 10, 20, 35]

# --- Note for the agent -------------------------------------------------------
# Bond interest rates have dropped significantly compared to 2025 (EDO was ~8%,
