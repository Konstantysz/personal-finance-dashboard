# Parametry rynkowe i podatkowe.
# Zweryfikuj przed każdą analizą inwestycyjną. Źródła w komentarzach.
# Agent: jeżeli last_verified starsze niż 60 dni — ostrzeż użytkownika.

last_verified: 2026-08-22

# --- Konta emerytalne -------------------------------------------------------
# Źródło: obwieszczenia MRPiPS, Monitor Polski; gov.pl/web/rodzina
# Limit roczny NIE przechodzi na kolejny rok. Deadline wpłaty: 31 grudnia.
konta_emerytalne:
  rok: 2026
  ike:
    limit: 28260.00          # 3 × prognozowane wynagrodzenie 9420 zł
    limit_poprzedni_rok: 26019.00
    korzysc: "brak podatku Belki przy wypłacie po 60 r.ż."
    ulga_pit: false
  ikze:
    limit_etat: 11304.00     # 1,2 × 9420 zł
    limit_jdg: 16956.00      # 1,8 × 9420 zł
    limit_etat_poprzedni_rok: 10407.60
    korzysc: "odliczenie od podstawy PIT w roku wpłaty; 10% ryczałtu przy wypłacie po 65 r.ż."
    ulga_pit: true
  # Suma dla etatowca korzystającego z obu: 39 564 zł

# --- Podatki ----------------------------------------------------------------
podatki:
  belka: 0.19
  pit_prog_1: 0.12
  pit_prog_2: 0.32
  pit_prog_2_od: 120000.00

# --- Obligacje detaliczne ---------------------------------------------------
# Źródło: obligacjeskarbowe.pl — emisja SIERPIEŃ 2026.
# UWAGA: oprocentowanie zmienia się co miesiąc. Zweryfikuj przed zakupem.
# UWAGA: odsetki podlegają podatkowi Belki 19% POZA IKE/IKZE.
obligacje:
  emisja: 2026-08
  ots:                        # 3-miesięczne, stałe
    oprocentowanie: 0.0200
  ror:                        # roczne, stopa NBP + marża, odsetki miesięcznie
    pierwszy_okres: 0.0400
    marza: 0.0000
    indeksacja: stopa_nbp
  dor:                        # 2-letnie
    pierwszy_okres: 0.0415
    marza: 0.0015
    indeksacja: stopa_nbp
  tos:                        # 3-letnie, stałe, kapitalizacja
    oprocentowanie: 0.0440
  coi:                        # 4-letnie, inflacja + marża, odsetki co roku
    pierwszy_okres: 0.0475
    marza: 0.0150
    indeksacja: cpi
    okres_lat: 4
  edo:                        # 10-letnie, inflacja + marża, kapitalizacja
    pierwszy_okres: 0.0535
    marza: 0.0200
    indeksacja: cpi
    okres_lat: 10
  # Gwarancja: przy deflacji oprocentowanie nie spada poniżej marży.

# --- Otoczenie makro --------------------------------------------------------
makro:
  stopa_referencyjna_nbp: 0.0375     # od 2026-03-05
  cpi_rr: 0.030                      # lipiec 2026, szybki szacunek GUS
  cpi_rr_poprzedni: 0.025            # czerwiec 2026, finalnie
  konto_oszczednosciowe_pko: 0.0100  # oprocentowanie użytkownika, wszystkie progi
  konto_oszczednosciowe_rynek_top: 0.0600  # najlepsze oferty rynkowe, zwykle promocyjne

# --- Założenia do symulacji -------------------------------------------------
# Podawaj ZAWSZE co najmniej dwa scenariusze. To nie są prognozy.
symulacje:
  scenariusz_ostrozny:
    cpi: 0.025
    akcje_globalne_nominalnie: 0.050
    obligacje_edo: 0.045
  scenariusz_bazowy:
    cpi: 0.030
    akcje_globalne_nominalnie: 0.070
    obligacje_edo: 0.050
  horyzonty_lat: [1, 3, 5, 10, 20, 35]

# --- Notatka dla agenta -----------------------------------------------------
# Oprocentowanie obligacji spadło znacząco względem 2025 (EDO było ~8%, teraz
# 5,35% w pierwszym okresie). Jeżeli użytkownik odwołuje się do starszego planu
# opartego na 8% — zwróć na to uwagę, bo zmienia to rachunek opłacalności
# obligacje vs konto oszczędnościowe vs część akcyjna.
