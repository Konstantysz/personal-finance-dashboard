# Template. The agent fills it in during /profil and saves it as config/profile.yaml.
# profile.yaml is in .gitignore - it does not go into the repo.

meta:
  utworzony: null
  zaktualizowany: null

osoba:
  wiek: null
  forma_zatrudnienia: null      # etat | jdg | inne - determines the IKZE limit
  prog_podatkowy: null          # 12 | 32 - determines the value of the IKZE deduction
  dochod_netto_miesiecznie: null
  dochod_stabilny: null         # true | false
  dzien_wyplaty: null           # day of month, detected from data and confirmed
  dzien_wyplaty_przesuniecie: poprzedzajacy_dzien_roboczy  # shift rule when dzien_wyplaty falls on a weekend/holiday
  tryb_okresu: kalendarzowy     # kalendarzowy (default) | wyplata - bucket months by payday-to-payday cycle instead of calendar month

# --- Period division. The most important section of the file. -----------------
okresy:
  regime_change_date: 2025-08-01
  regime_change_opis: "move - independent apartment"
  regime_change_potwierdzony: false   # agent sets to true after verification with the user
  archive_od: 2022-07-01
  # Earlier regime changes, if any (job change, moving out from parents,
  # end of studies). Format: date + description.
  inne_przelomy: []

konta:
  oszczednosciowe: []           # only these; transfers HERE = savings
  biezace: []
  inwestycyjne: []
  wykluczone_z_majatku: []      # e.g., lunch card (benefit, not liquid funds)
  # Actual balances as of a date - for sanity check against the transaction sum
  salda_rzeczywiste:
    data: null
    wartosci: {}

cele:
  krotkoterminowe: []
    # - nazwa: "down payment for an apartment"
    #   kwota: 150000
    #   termin: 2029-08
    #   priorytet: 1
  dlugoterminowe: []
  pozyczki_wlasne: []
    # Money withdrawn from a savings account, repaid in fixed installments
    # back to that same account. Not a projection - /goal checks it against
    # actual transfers.
    # - nazwa: "concert pass 2027"
    #   kwota: 945
    #   konto_zrodlowe: "Savings account"   # must be in konta.oszczednosciowe
    #   data_zaciagniecia: 2026-09-01
    #   rata_miesieczna: 94.5
    #   pierwsza_rata: 2026-09
    #   ostatnia_rata: 2027-07

profil_inwestycyjny:
  tolerancja_ryzyka: null       # niska | srednia | wysoka
  wiedza: null                  # zadna | podstawowa | srednia | zaawansowana
  ograniczenia: []              # instruments excluded by the user
  doradca_zewnetrzny: null      # whether someone advises and whether it needs to be accounted for

stan_wdrozenia:
  # What the user ACTUALLY did, not what they planned.
  ike_zalozone: null
  ike_wplacone_w_tym_roku: null
  ikze_zalozone: null
  ikze_wplacone_w_tym_roku: null
  obligacje_posiadane: []
  etf_posiadane: []
  poduszka_finansowa_kwota: null

preferencje_raportu:
  jezyk: pl
  waluta: PLN
  domyslne_okno: active         # active | recent | archive | all
