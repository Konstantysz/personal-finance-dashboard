[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-finance-dashboard"
version = "0.1.0"
description = "Personal finance analysis - CLI + Claude Code agent"
requires-python = ">=3.12"

authors = [{ name = "Konstanty Szumigaj" }]

license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "holidays>=0.103",
]


[project.scripts]
personal-finance-dashboard = "personal_finance_dashboard.cli:app"


[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pre-commit",
    "pandas-stubs",
    "types-PyYAML",
]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) w domyślnych argumentach to idiom Typer, nie błąd.
"src/personal_finance_dashboard/cli.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "--cov=src/personal_finance_dashboard --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "holidays.*"
ignore_missing_imports = true
